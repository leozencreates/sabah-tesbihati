<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sabah Tesbihatı</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f1720);
    --bg2: var(--tg-theme-secondary-bg-color, #17212b);
    --text: var(--tg-theme-text-color, #f2f4f7);
    --hint: var(--tg-theme-hint-color, #8a97a6);
    --accent: var(--tg-theme-button-color, #3fa37c);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --link: var(--tg-theme-link-color, #6ab3f3);
    --gold: #d4a94c;
    --radius: 18px;
    --vh: var(--tg-viewport-stable-height, 100vh);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: var(--vh);
    display: flex; flex-direction: column;
    user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  header { padding: 14px 16px 8px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand { font-weight: 700; font-size: 18px; }
  .brand small { display: block; font-weight: 400; font-size: 12px; color: var(--hint); margin-top: 2px; }
  .chips { display: flex; gap: 6px; }
  .chip {
    background: var(--bg2); border-radius: 999px; padding: 7px 11px;
    font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 5px;
  }
  .chip.streak { color: var(--gold); }
  .progress { margin-top: 12px; height: 6px; background: var(--bg2); border-radius: 99px; overflow: hidden; }
  .progress > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s; }
  .step-meta { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--hint); }

  main { flex: 1; display: flex; flex-direction: column; padding: 4px 16px 0; min-height: 0; }
  .card {
    background: var(--bg2); border-radius: var(--radius); padding: 16px;
    flex: 1 1 auto; min-height: 120px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    user-select: text; -webkit-user-select: text;
  }
  .card h2 { margin: 0 0 4px; font-size: 17px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { font-size: 11px; font-weight: 600; color: var(--gold); border: 1px solid var(--gold); border-radius: 99px; padding: 2px 8px; }
  .pre { font-size: 13px; color: var(--hint); margin: 6px 0 0; font-style: italic; }
  .ar {
    font-family: Amiri, "Traditional Arabic", serif; direction: rtl; text-align: center;
    font-size: 27px; line-height: 2; margin: 12px 0 6px;
  }
  .ar.long { font-size: 23px; text-align: justify; text-align-last: center; }
  .tr { font-size: 15px; line-height: 1.55; text-align: center; font-weight: 500; margin: 8px 0; }
  .mean { font-size: 13.5px; line-height: 1.55; color: var(--hint); text-align: center; margin: 8px 0 0; }
  .hidden { display: none !important; }

  .counter-wrap { display: flex; flex-direction: column; align-items: center; padding: 14px 0 6px; flex-shrink: 0; }
  .counter {
    position: relative; width: min(58vw, 220px); aspect-ratio: 1; border-radius: 50%;
    touch-action: manipulation; transition: transform .08s;
  }
  .counter:active { transform: scale(.96); }
  .counter svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .counter .track { stroke: var(--bg2); }
  .counter .bar { stroke: var(--accent); transition: stroke-dashoffset .2s; stroke-linecap: round; }
  .counter.done .bar { stroke: var(--gold); }
  .counter .face {
    position: absolute; inset: 14px; border-radius: 50%; background: var(--bg2);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .count { font-size: 52px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .target { font-size: 14px; color: var(--hint); margin-top: 6px; }
  .tap-hint { font-size: 12px; color: var(--hint); margin-top: 4px; }

  .controls {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
    padding: 8px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .ctrl {
    background: var(--bg2); border-radius: 14px; padding: 12px 6px;
    font-size: 13px; font-weight: 600; text-align: center;
  }
  .ctrl:disabled { opacity: .35; }
  .ctrl.primary { background: var(--accent); color: var(--accent-text); }

  /* Overlay sheets */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 10; display: flex; align-items: flex-end; }
  .sheet {
    background: var(--bg); width: 100%; max-height: 80vh; overflow-y: auto;
    border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  }
  .sheet h3 { margin: 0 0 12px; font-size: 17px; }
  .list-item {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 11px 12px; border-radius: 12px; font-size: 14px;
  }
  .list-item.current { background: var(--bg2); }
  .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--hint); flex-shrink: 0;
         display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .list-item.complete .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .list-item .n { margin-left: auto; color: var(--hint); font-size: 13px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 12px 2px; font-size: 15px; border-bottom: 1px solid var(--bg2); }
  .switch { width: 46px; height: 28px; border-radius: 99px; background: var(--bg2); position: relative; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch.on { background: var(--accent); }
  .switch.on::after { transform: translateX(18px); }
  .danger { color: #e5534b; width: 100%; padding: 14px; margin-top: 10px; border-radius: 12px; background: var(--bg2); font-weight: 600; }
  .note { font-size: 12px; color: var(--hint); line-height: 1.5; margin-top: 14px; }

  /* Completion */
  .finish { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 10px; }
  .finish .big { font-family: Amiri, serif; font-size: 34px; direction: rtl; }
  .finish h2 { margin: 6px 0 0; }
  .finish p { color: var(--hint); margin: 0; line-height: 1.5; }
  .finish .streak-num { font-size: 44px; font-weight: 700; color: var(--gold); margin-top: 12px; }
  .week { display: flex; gap: 6px; margin-top: 8px; }
  .week span { width: 34px; height: 34px; border-radius: 10px; background: var(--bg2); font-size: 11px; display: flex; align-items: center; justify-content: center; color: var(--hint); }
  .week span.on { background: var(--accent); color: var(--accent-text); }

  /* Tesbihmatik */
  .tsb { flex: 1; display: flex; flex-direction: column; min-height: var(--vh); }
  .tsb main { justify-content: center; }
  .seg { display: flex; background: var(--bg2); border-radius: 12px; padding: 4px; margin-top: 12px; }
  .seg button { flex: 1; padding: 9px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--hint); }
  .seg button.on { background: var(--accent); color: var(--accent-text); }
  .tsb-stats { display: flex; justify-content: center; gap: 28px; margin-top: 18px; text-align: center; }
  .tsb-stats b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .tsb-stats span { font-size: 12px; color: var(--hint); }
  .counter.big { width: min(72vw, 290px); }
  .counter.big .count { font-size: 68px; }
  .tsb .controls { grid-template-columns: 1fr 1fr; }
</style>
</head>
<body>

<div id="app-main" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <header>
    <div class="top">
      <div class="brand"><span data-i18n="appTitle">Sabah Tesbihatı</span><small id="today"></small></div>
      <div class="chips">
        <div class="chip streak" id="streakChip" data-i18n-title="streak">🔥 <span id="streak">0</span></div>
        <button class="chip" id="tsbBtn" data-i18n-aria="tsbTitle">📿</button>
        <button class="chip" id="listBtn" data-i18n-aria="steps">☰</button>
        <button class="chip" id="settingsBtn" data-i18n-aria="settings">⚙</button>
      </div>
    </div>
    <div class="progress"><i id="progressBar"></i></div>
    <div class="step-meta"><span id="stepNo"></span><span id="totalCount"></span></div>
  </header>

  <main>
    <article class="card" id="card">
      <h2 id="title"></h2>
      <p class="pre" id="pre"></p>
      <div class="ar" id="ar"></div>
      <div class="tr" id="tr"></div>
      <p class="mean" id="mean"></p>
    </article>

    <div class="counter-wrap">
      <button class="counter" id="counter" data-i18n-aria="count">
        <svg viewBox="0 0 200 200">
          <circle class="track" cx="100" cy="100" r="92" fill="none" stroke-width="10"/>
          <circle class="bar" id="ring" cx="100" cy="100" r="92" fill="none" stroke-width="10"/>
        </svg>
        <div class="face">
          <div class="count" id="count">0</div>
          <div class="target" id="target"></div>
          <div class="tap-hint" id="tapHint"></div>
        </div>
      </button>
    </div>
  </main>

  <nav class="controls">
    <button class="ctrl" id="prevBtn" data-i18n="prev">‹ Önceki</button>
    <button class="ctrl" id="undoBtn" data-i18n="undo">↺ Geri al</button>
    <button class="ctrl primary" id="nextBtn">Sonraki ›</button>
  </nav>
</div>

<div id="finish" class="finish hidden">
  <div class="big">تَقَبَّلَ اللّٰهُ</div>
  <h2 data-i18n="accepted">Allah kabul etsin</h2>
  <p data-i18n="completed">Bugünkü sabah tesbihatını tamamladın.</p>
  <div class="streak-num">🔥 <span id="finishStreak">1</span></div>
  <p id="finishStreakLabel"></p>
  <div class="week" id="week"></div>
  <div style="display:flex;gap:8px;margin-top:22px;width:100%;max-width:340px">
    <button class="ctrl" style="flex:1" id="againBtn" data-i18n="again">Baştan başla</button>
    <button class="ctrl primary" style="flex:1" id="closeBtn" data-i18n="close">Kapat</button>
  </div>
</div>

<div id="tsb" class="tsb hidden">
  <header>
    <div class="top">
      <div class="brand"><span data-i18n="tsbTitle">Tesbihmatik</span><small data-i18n="tsbSub">Serbest zikir sayacı</small></div>
      <div class="chips"><button class="chip" id="tsbClose" data-i18n-aria="backToMain">✕</button></div>
    </div>
    <div class="seg" id="tsbSeg">
      <button data-n="33">33</button>
      <button data-n="99">99</button>
    </div>
  </header>

  <main>
    <div class="counter-wrap">
      <button class="counter big" id="tsbCounter" data-i18n-aria="count">
        <svg viewBox="0 0 200 200">
          <circle class="track" cx="100" cy="100" r="92" fill="none" stroke-width="10"/>
          <circle class="bar" id="tsbRing" cx="100" cy="100" r="92" fill="none" stroke-width="10"/>
        </svg>
        <div class="face">
          <div class="count" id="tsbCount">0</div>
          <div class="target" id="tsbTarget">/ 33</div>
          <div class="tap-hint" data-i18n="tap">dokun</div>
        </div>
      </button>
    </div>
    <div class="tsb-stats">
      <div><b id="tsbRounds">0</b><span data-i18n="rounds">tur</span></div>
      <div><b id="tsbTotal">0</b><span data-i18n="totalLow">toplam</span></div>
    </div>
  </main>

  <nav class="controls">
    <button class="ctrl" id="tsbUndo" data-i18n="undo">↺ Geri al</button>
    <button class="ctrl" id="tsbReset" data-i18n="reset">Sıfırla</button>
  </nav>
</div>

<div id="listSheet" class="sheet-bg hidden">
  <div class="sheet"><h3 data-i18n="steps">Adımlar</h3><div id="stepList"></div></div>
</div>

<div id="settingsSheet" class="sheet-bg hidden">
  <div class="sheet">
    <h3 data-i18n="settings">Ayarlar</h3>
    <div class="row" style="border:0;padding-bottom:0" data-i18n="language">Dil</div>
    <div class="seg" id="langSeg" style="margin-top:8px;margin-bottom:6px">
      <button data-lang="tr">Türkçe</button>
      <button data-lang="en">English</button>
      <button data-lang="ru">Русский</button>
    </div>
    <div class="row"><span data-i18n="showAr">Arapça metin</span><button class="switch" data-key="showAr"></button></div>
    <div class="row"><span data-i18n="showTr">Okunuş</span><button class="switch" data-key="showTr"></button></div>
    <div class="row"><span data-i18n="showMean">Anlam (meal)</span><button class="switch" data-key="showMean"></button></div>
    <div class="row"><span data-i18n="haptic">Titreşim</span><button class="switch" data-key="haptic"></button></div>
    <div class="row"><span data-i18n="autoNext">Hedefe ulaşınca otomatik geç</span><button class="switch" data-key="autoNext"></button></div>
    <button class="danger" id="resetToday" data-i18n="resetToday">Bugünü sıfırla</button>
    <p class="note" data-i18n="note"></p>
  </div>
</div>

<script>
// Her adımda title / pre / tl (okunuş) / mean dile göre: { tr, en, ru }
const STEPS = [
  {
    title: { tr: "İstiğfar", en: "Istighfar", ru: "Истигфар" },
    ar: "أَسْتَغْفِرُ اللّٰهَ",
    tl: { tr: "Estağfirullâh", en: "Astaghfirullah", ru: "Астагфируллах" },
    mean: {
      tr: "Allah'tan bağışlanma dilerim.",
      en: "I seek forgiveness from Allah.",
      ru: "Прошу прощения у Аллаха."
    },
    n: 3
  },
  {
    title: { tr: "Selâm duası", en: "Prayer of peace", ru: "Дуа мира" },

    tl: {
      tr: "Allâhümme ente's-selâmü ve minke's-selâm, tebârakte yâ ze'l-celâli ve'l-ikrâm.",
      en: "Allahumma antas-salamu wa minkas-salam, tabarakta ya dhal-jalali wal-ikram.",

    mean: {
      tr: "Allah'ım! Sen Selâm'sın, esenlik ancak sendendir. Ey celâl ve ikram sahibi, sen ne yücesin!",
      en: "O Allah! You are Peace and from You comes peace. Blessed are You, O Possessor of majesty and honour!",

    n: 1
  },
  {

    },
    mean: {

      en: "O Allah, send blessings upon our master Muhammad and upon the family of our master Muhammad.",
      ru: "О Аллах, благослови нашего господина Мухаммада и семью нашего господина Мухаммада."

  },
  {

    note: "Порядок и количество повторений соответствуют широко распространённому тасбихату после утреннего намаза и могут различаться в зависимости от региона и традиции. Шаги с пометкой «Только утром» — дополнительные зикры, читаемые после утреннего (и вечернего) намаза."
  }
};
const LANGS = Object.keys(I18N);

const tg = window.Telegram && window.Telegram.WebApp;
const $ = id => document.getElementById(id);
const RING_C = 2 * Math.PI * 92;

const DEFAULT_SETTINGS = { showAr: true, showTr: true, showMean: true, haptic: true, autoNext: true, lang: null };
let settings = { ...DEFAULT_SETTINGS };
let state = null;      // { date, step, counts: [] }
let history = [];      // tamamlanan günler: ["2026-10-18", ...]
let lang = "tr";

// ---------- Dil ----------
// Kayıtlı seçim yoksa Telegram'ın (yoksa tarayıcının) diline göre seç
function detectLang() {
  const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  const code = ((user && user.language_code) || navigator.language || "").toLowerCase();
  if (code.startsWith("tr")) return "tr";
  if (/^(ru|uk|be|kk|ky)/.test(code)) return "ru";
  return code ? "en" : "tr";
}
function t(key, ...args) {
  const v = I18N[lang][key];
  return typeof v === "function" ? v(...args) : v;
}
function applyLang() {
  lang = LANGS.includes(settings.lang) ? settings.lang : detectLang();
  document.documentElement.lang = lang;
  document.title = t("appTitle");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  document.querySelectorAll("[data-i18n-title]").forEach(el => el.setAttribute("title", t(el.dataset.i18nTitle)));
}

// ---------- Depolama (Telegram CloudStorage, yoksa localStorage) ----------
const useCloud = !!(tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9"));

function storeGet(key) {
  return new Promise(resolve => {
    if (useCloud) {
      tg.CloudStorage.getItem(key, (err, val) => resolve(err ? localGet(key) : (val || localGet(key))));
    } else {
      resolve(localGet(key));
    }
  });
}
function storeSet(key, value) {
  try { localStorage.setItem(key, value); } catch (e) {}
  if (useCloud) tg.CloudStorage.setItem(key, value, () => {});
}
function localGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function parse(str, fallback) {
  try { return str ? JSON.parse(str) : fallback; } catch (e) { return fallback; }
}

// ---------- Tarih ve seri ----------
function dateKey(d = new Date()) {
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function streak() {
  const set = new Set(history);
  const d = new Date();
  if (!set.has(dateKey(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (set.has(dateKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function freshState() {
  return { date: dateKey(), step: 0, counts: STEPS.map(() => 0) };
}

// ---------- Titreşim ----------
function haptic(kind) {
  if (!settings.haptic || !tg || !tg.HapticFeedback) return;
  try {
    if (kind === "tap") tg.HapticFeedback.impactOccurred("light");
    else if (kind === "step") tg.HapticFeedback.notificationOccurred("success");
    else if (kind === "soft") tg.HapticFeedback.selectionChanged();
  } catch (e) {}
}

// ---------- Kaydetme ----------
function save() {
  storeSet("state", JSON.stringify(state));
}

// ---------- Çizim ----------
function render() {
  const s = STEPS[state.step];
  const c = state.counts[state.step];
  const done = c >= s.n;

  $("today").textContent = new Date().toLocaleDateString(t("locale"), { weekday: "long", day: "numeric", month: "long" });
  $("streak").textContent = streak();

  const completedSteps = state.counts.filter((v, i) => v >= STEPS[i].n).length;
  $("progressBar").style.width = (completedSteps / STEPS.length * 100) + "%";
  $("stepNo").textContent = t("stepNo", state.step + 1, STEPS.length);
  const totalDone = state.counts.reduce((a, v, i) => a + Math.min(v, STEPS[i].n), 0);
  const totalAll = STEPS.reduce((a, x) => a + x.n, 0);
  $("totalCount").textContent = t("total", totalDone, totalAll);

  const title = $("title");
  title.textContent = s.title[lang];
  if (s.special) {
    const b = document.createElement("span");
    b.className = "badge";
    b.textContent = t("special");
    title.appendChild(b);
  }
  $("pre").textContent = s.pre ? s.pre[lang] : "";
  $("pre").classList.toggle("hidden", !s.pre);
  $("ar").textContent = s.ar;
  $("ar").classList.toggle("long", !!s.long);
  $("ar").classList.toggle("hidden", !settings.showAr);
  $("tr").textContent = s.tl[lang];
  $("tr").classList.toggle("hidden", !settings.showTr);
  $("mean").textContent = s.mean[lang];
  $("mean").classList.toggle("hidden", !settings.showMean);

  $("count").textContent = c;
  $("target").textContent = s.n === 1 ? (done ? t("readDone") : t("once")) : `/ ${s.n}`;
  $("tapHint").textContent = done ? (state.step === STEPS.length - 1 ? t("finishHint") : t("cont")) : (s.n === 1 ? t("readOnce") : t("tap"));
  const ring = $("ring");
  ring.style.strokeDasharray = RING_C;
  ring.style.strokeDashoffset = RING_C * (1 - Math.min(c / s.n, 1));
  $("counter").classList.toggle("done", done);

  $("prevBtn").disabled = state.step === 0;
  $("undoBtn").disabled = c === 0;
  $("nextBtn").textContent = state.step === STEPS.length - 1 ? t("finishBtn") : t("next");

  if (tg && tg.BackButton) {
    state.step > 0 ? tg.BackButton.show() : tg.BackButton.hide();
  }
}

function scrollCardTop() { $("card").scrollTop = 0; }

function goTo(i) {
  state.step = Math.max(0, Math.min(STEPS.length - 1, i));
  save(); scrollCardTop(); render();
}

function next() {
  if (state.step === STEPS.length - 1) { finish(); return; }
  haptic("soft");
  goTo(state.step + 1);
}

let advanceTimer = null;
function tap() {
  const s = STEPS[state.step];
  const c = state.counts[state.step];
  if (c >= s.n) { clearTimeout(advanceTimer); next(); return; }

  state.counts[state.step] = c + 1;
  save();
  if (c + 1 >= s.n) {
    haptic("step");
    render();
    if (settings.autoNext) {
      clearTimeout(advanceTimer);
      advanceTimer = setTimeout(() => {
        if (state.counts[state.step] >= STEPS[state.step].n) next();
      }, 450);
    }
  } else {
    haptic("tap");
    render();
  }
}

function undo() {
  clearTimeout(advanceTimer);
  if (state.counts[state.step] > 0) {
    state.counts[state.step]--;
    haptic("soft"); save(); render();
  }
}

function finish() {
  const today = dateKey();
  if (!history.includes(today)) {
    history.push(today);
    history = history.slice(-400);
    storeSet("history", JSON.stringify(history));
  }
  haptic("step");
  if (tg && tg.BackButton) tg.BackButton.hide();
  $("app-main").style.display = "none";
  $("finish").classList.remove("hidden");

  const st = streak();
  $("finishStreak").textContent = st;
  $("finishStreakLabel").textContent = t("streakLabel", st);

  const week = $("week");
  week.innerHTML = "";
  const set = new Set(history);
  for (let k = 6; k >= 0; k--) {
    const d = new Date(); d.setDate(d.getDate() - k);
    const el = document.createElement("span");
    el.textContent = d.toLocaleDateString(t("locale"), { weekday: "short" });
    if (set.has(dateKey(d))) el.classList.add("on");
    week.appendChild(el);
  }
}

function restart() {
  state = freshState(); save();
  $("finish").classList.add("hidden");
  $("app-main").style.display = "flex";
  scrollCardTop(); render();
}

// ---------- Tesbihmatik ----------
let tsb = { target: 33, count: 0, rounds: 0, total: 0 };
let tsbOpen = false;

function saveTsb() { storeSet("tesbih", JSON.stringify(tsb)); }

function renderTsb() {
  const done = tsb.count >= tsb.target;
  $("tsbCount").textContent = tsb.count;
  $("tsbTarget").textContent = `/ ${tsb.target}`;
  $("tsbRounds").textContent = tsb.rounds;
  $("tsbTotal").textContent = tsb.total;
  const ring = $("tsbRing");
  ring.style.strokeDasharray = RING_C;
  ring.style.strokeDashoffset = RING_C * (1 - Math.min(tsb.count / tsb.target, 1));
  $("tsbCounter").classList.toggle("done", done);
  $("tsbUndo").disabled = tsb.count === 0;
  document.querySelectorAll("#tsbSeg button").forEach(b => b.classList.toggle("on", +b.dataset.n === tsb.target));
}

function tsbTap() {
  if (tsb.count >= tsb.target) tsb.count = 0;   // tur bitti, yeni tura başla
  tsb.count++; tsb.total++;
  if (tsb.count === tsb.target) { tsb.rounds++; haptic("step"); }
  else if (tsb.count % 33 === 0) haptic("step"); // 99'da 33 ve 66'da işaret
  else haptic("tap");
  saveTsb(); renderTsb();
}

function tsbUndo() {
  if (tsb.count === 0) return;
  if (tsb.count === tsb.target) tsb.rounds--;
  tsb.count--; tsb.total--;
  haptic("soft"); saveTsb(); renderTsb();
}

function setTsbTarget(n) {
  if (n === tsb.target) return;
  tsb.target = n; tsb.count = 0;
  haptic("soft"); saveTsb(); renderTsb();
}

function openTsb() {
  tsbOpen = true;
  $("app-main").style.display = "none";
  $("finish").classList.add("hidden");
  $("tsb").classList.remove("hidden");
  if (tg && tg.BackButton) tg.BackButton.show();
  renderTsb();
}

function closeTsb() {
  tsbOpen = false;
  $("tsb").classList.add("hidden");
  if (history.includes(dateKey()) && state.counts.every((v, i) => v >= STEPS[i].n)) finish();
  else { $("app-main").style.display = "flex"; render(); }
}

// ---------- Sayfalar ----------
function openSheet(id) { $(id).classList.remove("hidden"); }
function closeSheet(id) { $(id).classList.add("hidden"); }

function renderList() {
  const box = $("stepList");
  box.innerHTML = "";
  STEPS.forEach((s, i) => {
    const b = document.createElement("button");
    const complete = state.counts[i] >= s.n;
    b.className = "list-item" + (i === state.step ? " current" : "") + (complete ? " complete" : "");
    const dot = document.createElement("span"); dot.className = "dot"; dot.textContent = complete ? "✓" : "";
    const t = document.createElement("span"); t.textContent = s.title[lang] + (s.special ? " ✦" : "");
    const n = document.createElement("span"); n.className = "n"; n.textContent = `${Math.min(state.counts[i], s.n)}/${s.n}`;
    b.append(dot, t, n);
    b.onclick = () => { closeSheet("listSheet"); goTo(i); };
    box.appendChild(b);
  });
}

function renderSettings() {
  document.querySelectorAll(".switch").forEach(sw => sw.classList.toggle("on", !!settings[sw.dataset.key]));
  document.querySelectorAll("#langSeg button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
}

// ---------- Olaylar ----------
$("counter").addEventListener("click", tap);
$("undoBtn").addEventListener("click", undo);
$("prevBtn").addEventListener("click", () => { clearTimeout(advanceTimer); haptic("soft"); goTo(state.step - 1); });
$("nextBtn").addEventListener("click", () => { clearTimeout(advanceTimer); next(); });
$("listBtn").addEventListener("click", () => { renderList(); openSheet("listSheet"); });
$("settingsBtn").addEventListener("click", () => { renderSettings(); openSheet("settingsSheet"); });
document.querySelectorAll(".sheet-bg").forEach(bg => bg.addEventListener("click", e => { if (e.target === bg) bg.classList.add("hidden"); }));
document.querySelectorAll(".switch").forEach(sw => sw.addEventListener("click", () => {
  settings[sw.dataset.key] = !settings[sw.dataset.key];
  storeSet("settings", JSON.stringify(settings));
  renderSettings(); render();
}));
document.querySelectorAll("#langSeg button").forEach(b => b.addEventListener("click", () => {
  settings.lang = b.dataset.lang;
  storeSet("settings", JSON.stringify(settings));
  haptic("soft"); applyLang(); renderSettings(); render();
}));
$("resetToday").addEventListener("click", () => { closeSheet("settingsSheet"); restart(); });
$("againBtn").addEventListener("click", restart);
$("closeBtn").addEventListener("click", () => { if (tg && tg.close) tg.close(); });
$("tsbBtn").addEventListener("click", openTsb);
$("tsbClose").addEventListener("click", closeTsb);
$("tsbCounter").addEventListener("click", tsbTap);
$("tsbUndo").addEventListener("click", tsbUndo);
$("tsbReset").addEventListener("click", () => { tsb = { target: tsb.target, count: 0, rounds: 0, total: 0 }; haptic("soft"); saveTsb(); renderTsb(); });
document.querySelectorAll("#tsbSeg button").forEach(b => b.addEventListener("click", () => setTsbTarget(+b.dataset.n)));

// Telegram yoksa (tarayıcıda test) klavye: boşluk = say, Backspace = geri al
document.addEventListener("keydown", e => {
  if (tsbOpen) {
    if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); tsbTap(); }
    else if (e.code === "Backspace") { e.preventDefault(); tsbUndo(); }
    else if (e.code === "Escape") closeTsb();
    return;
  }
  if (!$("finish").classList.contains("hidden")) return;
  if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); tap(); }
  else if (e.code === "Backspace") { e.preventDefault(); undo(); }
  else if (e.code === "ArrowRight") next();
  else if (e.code === "ArrowLeft") goTo(state.step - 1);
});

// Gün değiştiyse (uygulama açık kalmışsa) yeni güne başla
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && state && state.date !== dateKey()) {
    if (tsbOpen) { state = freshState(); save(); } else restart();
  }
});

// ---------- Başlangıç ----------
(async function init() {
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.disableVerticalSwipes) try { tg.disableVerticalSwipes(); } catch (e) {}
    if (tg.BackButton) tg.BackButton.onClick(() => tsbOpen ? closeTsb() : goTo(state.step - 1));
    try {
      tg.setHeaderColor("bg_color");
      tg.setBackgroundColor("bg_color");
    } catch (e) {}
  }

  const [st, hi, se, ts] = await Promise.all([storeGet("state"), storeGet("history"), storeGet("settings"), storeGet("tesbih")]);
  settings = { ...DEFAULT_SETTINGS, ...parse(se, {}) };
  applyLang();
  tsb = { ...tsb, ...parse(ts, {}) };
  history = parse(hi, []);
  const saved = parse(st, null);
  state = (saved && saved.date === dateKey() && Array.isArray(saved.counts) && saved.counts.length === STEPS.length)
    ? saved : freshState();

  render();
  // Bottaki "Tesbihmatik" butonu uygulamayı #tesbih ile açar
  if (location.hash === "#tesbih") openTsb();
  else if (history.includes(dateKey()) && state.counts.every((v, i) => v >= STEPS[i].n)) finish();
})();
</script>
</body>
</html>
